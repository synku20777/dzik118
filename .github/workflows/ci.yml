name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dummy values only: astro.config.ts declares these as required secrets
    # with no default, and .dev.vars (gitignored) doesn't exist in CI.
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
      SUPABASE_SECRET_KEY: ci-dummy-secret-key
      APP_BASE_URL: http://localhost:4321
      INTERNAL_CRON_SECRET: ci-dummy-cron-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # astro:env/server and Locals types are generated into .astro/
      # (gitignored); tsc needs them before typecheck runs.
      - name: Generate Astro types
        run: npx astro sync

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Check Astro
        run: npm run astro:check

      - name: Run unit tests
        run: npm run test

      # Fails if src/db/schema/* changed without a matching committed
      # migration (generate would emit a new file/journal entry).
      - name: Check migration drift
        run: |
          npx drizzle-kit generate --name ci_drift
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"

      # Non-blocking for now: 7 high-severity advisories already exist.
      # Remove continue-on-error once they're resolved.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build project
        run: npm run build
