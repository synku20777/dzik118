name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    env:
      # Client-context env vars (astro:env) are inlined into the browser
      # bundle at build time, so `astro build`/`astro check` need *some*
      # value even though CI never talks to a real Supabase project.
      # Deployments must set real values via Cloudflare Worker secrets.
      PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-key"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Check Astro
        run: npm run astro:check

      - name: Run unit tests
        run: npm run test

      - name: Build project
        run: npm run build
