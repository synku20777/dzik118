name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dummy values only: astro.config.ts declares these as required secrets
    # with no default, and .dev.vars (gitignored) doesn't exist in CI.
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
      SUPABASE_SECRET_KEY: ci-dummy-secret-key
      APP_BASE_URL: http://localhost:4321
      INTERNAL_CRON_SECRET: ci-dummy-cron-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # astro:env/server and Locals types are generated into .astro/
      # (gitignored); tsc needs them before typecheck runs.
      - name: Generate Astro types
        run: npx astro sync

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Check Astro
        run: npm run astro:check

      - name: Run unit tests
        run: npm run test

      # Fails if src/db/schema/* changed without a matching committed
      # migration (generate would emit a new file/journal entry).
      - name: Check migration drift
        run: |
          npx drizzle-kit generate --name ci_drift
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build project
        run: npm run build

  # The money, payment and tenant-isolation rules are tested here, not in the
  # unit tests. A plain Postgres is enough for 28 of the 34 files; the six
  # excluded below need Supabase Storage or Auth and still run locally only
  # (`npx supabase start`, then `npm run test:integration`).
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Not blocking until this job has passed once on GitHub: it was checked
    # against a local Postgres 17 container only. Remove the next line then.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Dummy values: six suites read these when they load.
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
      SUPABASE_SECRET_KEY: ci-dummy-secret-key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The migrations revoke rights from the roles a Supabase database has.
      - name: Create the Supabase roles
        run: psql "$DATABASE_URL" -c "create role anon; create role authenticated; create role service_role;"

      # drizzle-kit can exit 0 after a failed migration, so count what was
      # applied against the journal.
      - name: Apply migrations
        run: |
          npx drizzle-kit migrate
          applied=$(psql "$DATABASE_URL" -tA -c "select count(*) from drizzle.__drizzle_migrations")
          expected=$(node -p "require('./drizzle/migrations/meta/_journal.json').entries.length")
          echo "applied $applied of $expected migrations"
          test "$applied" = "$expected"

      - name: Run integration tests
        run: >-
          npx vitest run --config vitest.integration.config.ts
          --exclude "**/admin-ux.test.ts"
          --exclude "**/automation.test.ts"
          --exclude "**/invoice-delivery.test.ts"
          --exclude "**/organizations-dwellings.test.ts"
          --exclude "**/resident-ux.test.ts"
          --exclude "**/security.test.ts"
